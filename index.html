<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Princess ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="loading">

<h1>❤️</h1>

<p>Loading...</p>

</div>

<div id="login">

<div class="card">

<h2>For My Princess ❤️</h2>

<p>Masukkan Password</p>

<input id="password" type="password">

<button onclick="login()">Masuk</button>

<p id="error"></p>

</div>

</div>

<div id="main">

<canvas id="heartCanvas"></canvas>

<div class="content">

<img src="assets/images/photo1.jpg" class="profile">

<h1 id="typing"></h1>

<p class="sub">Kurang kurangin marahnya ukhti ❤️</p>

<button onclick="openLetter()">💌 Klik Disini Ya Cantik</button>

<div class="gallery">

<img src="assets/images/photo1.jpg">

<img src="assets/images/photo2.jpg">

<img src="assets/images/photo3.jpg">

<img src="assets/images/photo4.jpg">

<img src="assets/images/photo5.jpg">

<img src="assets/images/photo6.jpg">

</div>

<div class="question">

<h2>Maukah Kamu Memaafkanku? ❤️</h2>

<button id="yesBtn">Iya ❤️</button>

<button id="noBtn">Tidak 😢</button>

</div>

</div>

<audio id="music" loop>

<source src="assets/music/love.mp3">

</audio>

</div>

<div id="letter">

<div class="letter-box">

<h2>Hai Nikmol ❤️</h2>

<p>

Aku mau minta maaf ya kalau tadi candaanku kurang enak malah bikin kamu bete. 

Aku ga niat bikin kamu bete, ukhti gaboleh marah lama lamaa ❤️

</p>

<button onclick="closeLetter()">Tutup</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
